# GitHub Pages (Jekyll) settings.
# SKILL.md is the only source text; it is rendered at the site root.
title: WealthPark Design Kit
description: WealthPark のブランドに沿って制作するための、人と AI の共通参照先
url: "https://wealthpark-design-team.github.io"
baseurl: "/design-kit"
lang: ja
# The theme is kept only for its bundled plugins (jekyll-seo-tag). Its CSS is not used;
# the page is styled by _layouts/default.html + web/site.css.
theme: jekyll-theme-primer

defaults:
  - scope:
      path: "SKILL.md"
    values:
      layout: default
      permalink: /
      title: WealthPark Design Kit

exclude:
  - README.md
  - .gitignore
